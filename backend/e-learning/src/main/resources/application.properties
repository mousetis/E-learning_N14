spring.application.name=e-learning
server.port=${PORT:8080}

# Nạp file .env (nếu có) ở thư mục chạy ứng dụng -> các biến ${...} bên dưới đọc được từ .env.
# Xem .env.example. Biến môi trường thật của hệ điều hành vẫn được ưu tiên.
spring.config.import=optional:file:.env[.properties]

# ---------- Database (PostgreSQL) ----------
# DB_URL ví dụ Neon: jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/e_learning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
# Schema được tạo bằng documents/database/e-learning.sql -> Hibernate chỉ kiểm tra (validate), không tự sửa bảng
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- Upload tệp ----------
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:500MB}

# ---------- JWT ----------
# Secret tối thiểu 32 ký tự (HS256). BẮT BUỘC đổi khi triển khai thật.
app.jwt.secret=${JWT_SECRET:change-me-elearning-n14-secret-key-at-least-32-chars}
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d

# ---------- Redis (lưu OTP, có TTL) ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=3s

# ---------- OTP ----------
# mode=redis (mặc định) | memory (chỉ để dev khi chưa có Redis; mất dữ liệu khi restart)
app.otp.mode=${OTP_MODE:redis}
app.otp.length=6
app.otp.ttl=5m
app.otp.max-attempts=5
app.otp.resend-cooldown=60s

# ---------- Email (SMTP) ----------
# Gmail: MAIL_USERNAME = địa chỉ gmail, MAIL_PASSWORD = "App password" 16 ký tự.
# Khi MAIL_USERNAME để trống, ứng dụng KHÔNG gửi email thật mà ghi mã OTP ra log (chỉ dùng khi dev).
# Đổi nhà cung cấp (Brevo, Mailtrap...) chỉ cần đổi MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@elearning.local}}
app.mail.from-name=E-Learning

# ---------- Địa chỉ công khai của backend (dùng tạo link tệp, trang thanh toán giả lập) ----------
# Điện thoại thật phải truy cập được địa chỉ này (dùng IP LAN của máy chạy backend, không dùng localhost).
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# ---------- Lưu trữ tệp (giai đoạn 1: lưu cục bộ trong thư mục uploads/) ----------
app.storage.mode=local
app.storage.local-dir=${STORAGE_DIR:uploads}
app.storage.signed-url-ttl=1h
app.storage.signing-secret=${STORAGE_SIGNING_SECRET:${app.jwt.secret}}

# ---------- Thanh toán ----------
# MOCK: trang thanh toán giả lập do backend phục vụ; VNPAY: cổng sandbox của VNPay.
app.payment.mock-enabled=${PAYMENT_MOCK_ENABLED:true}
app.payment.order-expiry=15m
# Sau khi thanh toán xong, trình duyệt được chuyển về link này (deep link của app) kèm ?orderCode=...&status=...
app.payment.app-redirect-url=${PAYMENT_APP_REDIRECT_URL:}

vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
# VNPay chuyển trình duyệt về địa chỉ này sau khi thanh toán; backend xác thực chữ ký rồi chuyển tiếp về app.
vnpay.return-url=${VNPAY_RETURN_URL:${app.public-base-url}/api/v1/payments/vnpay/return}

# ---------- Thông báo đẩy (FCM): giai đoạn 1 chỉ ghi log ----------
app.notification.mode=mock

# ---------- CORS (cho bản web/Expo web) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ---------- Jackson ----------
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------- PDF (chứng chỉ, báo cáo)
# Đường dẫn font .ttf hỗ trợ tiếng Việt; để trống thì tự dò (Arial / DejaVu / Liberation...)
app.pdf.font-path=${PDF_FONT_PATH:}
