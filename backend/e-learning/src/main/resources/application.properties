spring.application.name=e-learning
server.port=8080

# ---------- Database (PostgreSQL) ----------
# Có thể ghi đè bằng biến môi trường DB_URL / DB_USERNAME / DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/e_learning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA / Hibernate ----------
# Schema được tạo bằng documents/database/e-learning.sql -> Hibernate chỉ kiểm tra (validate), không tự sửa bảng
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JWT ----------
# Secret tối thiểu 32 ký tự (HS256). Đổi giá trị này khi triển khai thật.
app.jwt.secret=${JWT_SECRET:change-me-elearning-n14-secret-key-at-least-32-chars}
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d

# ---------- Dịch vụ ngoài: chạy chế độ giả lập (mock) ----------
app.otp.mode=mock
app.otp.ttl=5m
app.payment.mode=mock
app.storage.mode=mock
app.notification.mode=mock
